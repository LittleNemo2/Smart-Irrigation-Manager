<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${editing} ? 'Edit property' : 'Add property')}"></head>
<body>
<header th:replace="~{fragments/layout :: tabs}"></header>

<main class="container">
    <div class="title-bar">
        <h1 th:text="${editing} ? 'Edit property' : 'Add property'">Add property</h1>
    </div>

    <section class="panel">

        <form th:action="${editing} ? @{/properties/{id}(id=${propertyId})} : @{/properties}"
              th:object="${form}" method="post" novalidate>

            <div class="form-row">
                <label for="name">Property name</label>
                <input type="text" th:field="*{name}" maxlength="80">
                <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
            </div>

            <div class="form-row">
                <label for="address">Address</label>
                <input type="text" th:field="*{address}" maxlength="160">
                <p class="error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></p>
            </div>

            <div class="form-row">
                <label for="latitude">Latitude</label>
                <input type="number" step="0.0001" th:field="*{latitude}">
                <p class="error" th:if="${#fields.hasErrors('latitude')}" th:errors="*{latitude}"></p>
            </div>

            <div class="form-row">
                <label for="longitude">Longitude</label>
                <input type="number" step="0.0001" th:field="*{longitude}">
                <p class="error" th:if="${#fields.hasErrors('longitude')}" th:errors="*{longitude}"></p>
            </div>

            <div class="form-row">
                <label for="notes">Notes</label>
                <textarea th:field="*{notes}" rows="3" maxlength="500"></textarea>
                <p class="error" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></p>
            </div>

            <button type="submit" class="btn primary">Save</button>
            <a th:href="${editing} ? @{/properties/{id}(id=${propertyId})} : @{/properties}" class="btn">Cancel</a>
        </form>
    </section>
</main>
</body>
</html>
