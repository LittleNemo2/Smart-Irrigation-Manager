<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Smart Irrigation Manager</title>
</head>
<body>
<h1>Smart Irrigation Manager</h1>
<h2>Sign in</h2>

<p th:if="${param.error}" style="color:#b00020">Invalid username or password.</p>
<p th:if="${param.logout}" style="color:#1d6b3d">You have been signed out.</p>

<form th:action="@{/login}" method="post">
    <p>
        <label for="username">Username</label><br>
        <input type="text" id="username" name="username" required autofocus>
    </p>
    <p>
        <label for="password">Password</label><br>
        <input type="password" id="password" name="password" required>
    </p>
    <button type="submit">Sign in</button>
</form>
</body>
</html>
