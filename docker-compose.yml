services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: irrigation
      POSTGRES_USER: sim
      POSTGRES_PASSWORD: LocalOnly-ChangeMe
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sim -d irrigation"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/irrigation
      DATABASE_USERNAME: sim
      DATABASE_PASSWORD: LocalOnly-ChangeMe
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "false"
    ports:
      - "8080:8080"

volumes:
  pgdata: